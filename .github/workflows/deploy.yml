name: Deploy production to server

on:
  push:
    branches:
      - Deploy
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and pull club image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/toptuk/pmiclub
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          build-args: MODE=production
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/toptuk/pmiclub:buildcache
          cache-to: type=registry,ref=ghcr.io/toptuk/pmiclub:buildcache,mode=max

  deploy:
    name: Deploy PMI club
    runs-on: ubuntu-latest
    needs: build
    env:
      SSH_KEY_PATH: /tmp/ssh_key
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Make envfile
        run: export | grep "secret_" | sed "s/declare -x secret_//" > .env
        env:
          secret_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          secret_APP_HOST: ${{ secrets.APP_HOST }}
          secret_MEDIA_UPLOAD_URL: ${{ secrets.MEDIA_UPLOAD_URL }}
          secret_MEDIA_UPLOAD_CODE: ${{ secrets.MEDIA_UPLOAD_CODE }}
          secret_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          secret_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          secret_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          secret_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          secret_EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          secret_EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          secret_EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          secret_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          secret_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          secret_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          secret_TELEGRAM_BOT_URL: ${{ secrets.TELEGRAM_BOT_URL }}
          secret_TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          secret_TELEGRAM_CLUB_CHANNEL_URL: ${{ secrets.TELEGRAM_CLUB_CHANNEL_URL }}
          secret_TELEGRAM_CLUB_CHANNEL_ID: ${{ secrets.TELEGRAM_CLUB_CHANNEL_ID }}
          secret_TELEGRAM_CLUB_CHAT_ID: ${{ secrets.TELEGRAM_CLUB_CHAT_ID }}
          secret_TELEGRAM_ONLINE_CHANNEL_URL: ${{ secrets.TELEGRAM_ONLINE_CHANNEL_URL }}
          secret_TELEGRAM_ONLINE_CHANNEL_ID: ${{ secrets.TELEGRAM_ONLINE_CHANNEL_ID }}
          secret_TELEGRAM_HELP_DESK_BOT_QUESTION_CHANNEL_DISCUSSION_ID: ${{ secrets.TELEGRAM_HELP_DESK_BOT_QUESTION_CHANNEL_DISCUSSION_ID }}
          secret_TELEGRAM_HELP_DESK_BOT_QUESTION_CHANNEL_ID: ${{ secrets.TELEGRAM_HELP_DESK_BOT_QUESTION_CHANNEL_ID }}
          secret_TELEGRAM_HELP_DESK_BOT_TOKEN: ${{ secrets.TELEGRAM_HELP_DESK_BOT_TOKEN }}
          secret_JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          secret_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          secret_WEBHOOK_SECRETS: ${{ secrets.WEBHOOK_SECRETS }}
      - run: echo "GITHUB_SHA=$GITHUB_SHA" >> .env
      - run: echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ${{ env.SSH_KEY_PATH }} && chmod 600 ${{ env.SSH_KEY_PATH }}
      - run: scp -o StrictHostKeyChecking=no -i ${{ env.SSH_KEY_PATH }} -P ${{ secrets.PRODUCTION_SSH_PORT }} .env ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }}:/home/toptuk/pmi.moscow/club/.env
      - run: scp -o StrictHostKeyChecking=no -i ${{ env.SSH_KEY_PATH }} -P ${{ secrets.PRODUCTION_SSH_PORT }} docker-compose.production.yml ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }}:/home/toptuk/pmi.moscow/docker-compose.production.yml
      - run: scp -o StrictHostKeyChecking=no -i ${{ env.SSH_KEY_PATH }} -P ${{ secrets.PRODUCTION_SSH_PORT }} utils/sync_production_static.sh ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }}:/home/toptuk/pmi.moscow/utils/sync_production_static.sh
      - run: ssh -i ${{ env.SSH_KEY_PATH }} -p ${{ secrets.PRODUCTION_SSH_PORT }} ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }} "cd /home/toptuk/pmi.moscow && docker login ghcr.io -u $GITHUB_ACTOR -p ${{ secrets.TOKEN }} && docker pull ghcr.io/toptuk/pmiclub:$GITHUB_SHA && docker compose -f docker-compose.production.yml --env-file=./club/.env up -d && bash ./utils/sync_production_static.sh ghcr.io/toptuk/pmiclub:$GITHUB_SHA && docker system prune --all --force"
